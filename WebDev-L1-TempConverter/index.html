<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">
  <div class="card">
    <header class="card-header">
      <h1>Temperature Converter</h1>
      <p>Enter a value, pick its unit, and convert to the other two instantly.</p>
    </header>

    <form id="converter-form" novalidate>
      <div class="field-row">
        <div class="field field-value">
          <label for="temp-value">Value</label>
          <input
            type="text"
            inputmode="decimal"
            id="temp-value"
            name="temp-value"
            placeholder="e.g. 36.6"
            autocomplete="off"
          >
        </div>
        <div class="field field-unit">
          <label for="temp-unit">Unit</label>
          <select id="temp-unit" name="temp-unit">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-convert">Convert</button>

      <p id="error-message" class="error-message" role="alert" hidden></p>
    </form>

    <section class="results" aria-live="polite">
      <div class="result-row" data-unit="C">
        <span class="result-label">Celsius</span>
        <span class="result-value" id="result-c">—</span>
      </div>
      <div class="result-row" data-unit="F">
        <span class="result-label">Fahrenheit</span>
        <span class="result-value" id="result-f">—</span>
      </div>
      <div class="result-row" data-unit="K">
        <span class="result-label">Kelvin</span>
        <span class="result-value" id="result-k">—</span>
      </div>
    </section>
  </div>

  <p class="footnote">Absolute zero: −273.15°C · −459.67°F · 0 K — anything below is flagged.</p>
</main>

<script src="script.js"></script>
</body>
</html>
